<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Phishing URL Detector</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <header>
            <h1>Phishing URL Detector</h1>
            <div id="modelAccuracy" class="accuracy">Loading accuracy...</div>
        </header>

        <section class="check">
            <input type="text" id="urlInput" placeholder="Enter URL here" />
            <button id="checkBtn">Check URL</button>
            <div id="result" class="result"></div>
            <div id="bdWarning" class="bd-warning"></div>

            <h3>Probability</h3>
            <div class="probability-bar">
                <span>Legitimate</span>
                <div class="bar">
                    <div id="probLegit" class="fill"></div>
                </div>
            </div>

            <div class="probability-bar">
                <span>Phishing</span>
                <div class="bar">
                    <div id="probPhish" class="fill"></div>
                </div>
            </div>
        </section>

        <section class="charts">
            <div class="card">
                <h3>Confusion Matrix</h3>
                <canvas id="confMatrixChart"></canvas>
            </div>

            <div class="card">
                <h3>ROC Curve</h3>
                <canvas id="rocChart"></canvas>
            </div>

            <div class="card">
                <h3>Precision - Recall Curve</h3>
                <canvas id="prChart"></canvas>
            </div>

            <div class="card">
                <h3>Top Feature Importances</h3>
                <canvas id="fiChart"></canvas>
            </div>
        </section>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Matrix plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@1.2.0/dist/chartjs-chart-matrix.min.js"></script>

    <script src="script.js"></script>
</body>

</html>
